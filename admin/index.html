<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>运动会 · 管理后台</title><link rel="stylesheet" href="/style.css"><body><main><h1>运动会管理后台</h1><p id="message" role="status"></p><section id="dashboard"><form id="create"><label>比赛名称 <input name="title" value="摇一摇运动会" maxlength="30" required></label><button>创建比赛</button></form><form id="open"><label>继续已有比赛 <input name="code" placeholder="6 位房间号" maxlength="6" required></label><button>打开</button></form><section id="room" hidden><h2 id="room-title"></h2><p id="status"></p><p><a id="screen" target="_blank" rel="noreferrer">打开大屏</a> · <a id="play" target="_blank" rel="noreferrer">玩家入场链接</a></p><button id="start">开始比赛（倒计时 3 秒，比赛 40 秒）</button><button id="next">下一局</button><section id="history"><h2>每局排名记录</h2><p id="history-status">比赛结算后自动记录，开始下一局仍可回看。</p><label>查看局数 <select id="history-round"><option value="">暂无已结算比赛</option></select></label><button id="history-refresh" type="button">刷新记录</button><p id="history-time"></p><div class="history-scroll"><table id="history-table" hidden><thead><tr><th>排名</th><th>昵称</th><th>距离（米）</th><th>有效摇动（次）</th></tr></thead><tbody id="history-body"></tbody></table></div></section><iframe id="preview" title="只读大屏预览"></iframe></section></section></main><script src="/client.js" defer></script></body></html>
